<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiểm tra tải dữ liệu</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f0f4ff; }
        h2 { color: #333; }
        #appList { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .item { background: white; padding: 10px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 14px; }
        .loading { color: #007aff; }
        .error { color: #ff3b30; font-weight: bold; }
        #socialTest { margin-top: 30px; font-size: 13px; color: #555; }
    </style>
</head>
<body>
    <h2>🚀 Test Load Data</h2>
    <p id="status" class="loading">🔄 Đang tải dữ liệu từ db.json ...</p>

    <div id="appList"></div>
    <div id="socialTest"></div>

    <script>
        // Gọi thử file db.json
        fetch('db.json')
            .then(response => {
                if (!response.ok) throw new Error("Không tìm thấy file db.json");
                return response.json();
            })
            .then(data => {
                document.getElementById('status').innerHTML = "✅ Đã tải xong db.json!";
                document.getElementById('status').className = "";
                let html = '';
                for (const [key, value] of Object.entries(data)) {
                    html += `<div class="item">${value.Name} (${key})</div>`;
                }
                document.getElementById('appList').innerHTML = html;
                
                // Test luôn file social.json
                return fetch('social.json').then(res => res.json());
            })
            .then(socialData => {
                document.getElementById('socialTest').innerHTML = 
                    `✅ Đã tải xong social.json!<br>
                     Email: ${socialData.email || 'Không có'}<br>
                     Follow: ${socialData.Follow || 'Không có'}`;
            })
            .catch(error => {
                document.getElementById('status').innerHTML = `❌ LỖI: ${error.message}`;
                document.getElementById('status').className = "error";
            });
    </script>
</body>
</html>
